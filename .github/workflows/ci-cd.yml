name: CI/CD Test, Build & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Unit Tests & Validation
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Swift & Xcode
        run: |
          swift --version
          xcode-select -p

      - name: Lint Info.plist & Shell Scripts
        run: |
          plutil -lint apps/TapticVoice/Sources/TapticVoice/Resources/Info.plist
          bash -n apps/TapticVoice/scripts/fetch_deps.sh
          bash -n apps/TapticVoice/scripts/run_tests.sh
          bash -n apps/TapticVoice/build_app.sh
          bash -n package_release.sh

      - name: Run Swift Unit Tests (XCTest)
        run: |
          cd apps/TapticVoice
          swift test

  build-and-release:
    name: Build Portable App & Publish Release
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Offline Sherpa-ONNX Runtime & Tiny Models
        uses: actions/cache@v4
        with:
          path: apps/TapticVoice/Vendor
          key: sherpa-v1.13.8-models-fa-en-v1

      - name: Fetch Offline Dependencies (if cache miss)
        run: |
          chmod +x ./apps/TapticVoice/scripts/fetch_deps.sh ./apps/TapticVoice/scripts/run_tests.sh
          ./apps/TapticVoice/scripts/fetch_deps.sh

      - name: Verify Live Offline Persian & English TTS Integration
        run: |
          cd apps/TapticVoice
          swift run TapticCoreVerify

      - name: Build Universal Self-Contained App & Release Zip
        run: |
          chmod +x ./apps/TapticVoice/build_app.sh ./package_release.sh
          ./package_release.sh

      - name: Verify Zero External Dependencies & Codesign
        run: |
          APP="apps/TapticVoice/build/TapticVoice.app"
          codesign -vvv --deep "$APP"
          otool -L "$APP/Contents/MacOS/TapticVoice"
          otool -L "$APP/Contents/Frameworks/libsherpa-onnx-c-api.dylib"
          otool -L "$APP/Contents/Frameworks/libonnxruntime.dylib"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TapticVoice-macOS
          path: dist/TapticVoice-*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "TapticVoice Studio ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/TapticVoice-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
